// vectordb.proto defines the gRPC wire API for the vector search server.
//
// gRPC uses Protocol Buffers as its interface definition language: this file is
// the single source of truth for both the client and the server. `protoc` (via
// the Makefile target) generates Go types and client/server stubs from it into
// api/gen/. See docs/learning/07-grpc-api.md.
syntax = "proto3";

package vectordb.v1;

// go_package tells protoc-gen-go which Go import path + package the generated
// code belongs to. The ";vectordbpb" suffix sets the Go package name.
option go_package = "github.com/1morshed1/vectordb-go/api/gen;vectordbpb";

// VectorDB is the service RAG applications talk to.
service VectorDB {
  // CreateCollection registers a new collection with a fixed schema.
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  // DropCollection deletes a collection and all its data.
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  // ListCollections returns the names of all collections.
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);

  // Insert adds a single vector with optional metadata.
  rpc Insert(InsertRequest) returns (InsertResponse);
  // Delete removes a vector by id.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Search returns the nearest neighbors of a query vector, optionally filtered
  // by a metadata expression.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Snapshot compacts a collection (writes a snapshot, truncates its WAL).
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
}

// DistanceMetric mirrors internal/distance.Metric.
enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0; // treated as COSINE
  DISTANCE_METRIC_COSINE = 1;
  DISTANCE_METRIC_DOT = 2;
  DISTANCE_METRIC_EUCLIDEAN = 3;
}

// FilterStrategy mirrors internal/collection.FilterStrategy.
enum FilterStrategy {
  FILTER_STRATEGY_AUTO = 0;
  FILTER_STRATEGY_PRE = 1;
  FILTER_STRATEGY_POST = 2;
}

// MetadataValue is one metadata field value: string, number, or bool. Proto3's
// oneof gives us a tagged union so the type is explicit on the wire.
message MetadataValue {
  oneof value {
    string string_value = 1;
    double number_value = 2;
    bool bool_value = 3;
  }
}

message CreateCollectionRequest {
  string name = 1;
  int32 dim = 2;
  DistanceMetric metric = 3;
  // Optional HNSW tuning; 0 means "use the server default".
  int32 m = 4;
  int32 ef_construction = 5;
  int32 ef_search = 6;
}
message CreateCollectionResponse { string name = 1; }

message DropCollectionRequest { string name = 1; }
message DropCollectionResponse {}

message ListCollectionsRequest {}
message ListCollectionsResponse { repeated string names = 1; }

message InsertRequest {
  string collection = 1;
  uint64 id = 2;
  repeated float vector = 3;
  map<string, MetadataValue> metadata = 4;
}
message InsertResponse {}

message DeleteRequest {
  string collection = 1;
  uint64 id = 2;
}
message DeleteResponse {}

message SearchRequest {
  string collection = 1;
  repeated float vector = 2;
  int32 top_k = 3;
  // ef_search beam width; 0 uses the collection default.
  int32 ef_search = 4;
  // filter is a metadata filter expression, e.g. category == "finance" AND
  // year >= 2024. Empty means no filter.
  string filter = 5;
  FilterStrategy strategy = 6;
}

message SearchHit {
  uint64 id = 1;
  float distance = 2;
  map<string, MetadataValue> metadata = 3;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  // strategy_used is the concrete strategy the server ran (useful when the
  // request asked for AUTO).
  FilterStrategy strategy_used = 2;
  // matched is how many vectors passed the filter, when the server computed it
  // (-1 when unknown, e.g. pure post-filter).
  int32 matched = 3;
}

message SnapshotRequest { string collection = 1; }
message SnapshotResponse {}
